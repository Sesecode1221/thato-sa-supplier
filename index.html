<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SAsuppliers.com | B2B Marketplace for SA SMEs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; }
        .card-hover:hover { transform: translateY(-4px); transition: 0.2s; box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1); }
        .product-img-card { height: 190px; object-fit: cover; width: 100%; }
        .modal-backdrop { backdrop-filter: blur(4px); }
        .toast-notification { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .landing-hero { background: linear-gradient(135deg, #0A2540 0%, #1B4D3E 100%); }
        .package-card { transition: all 0.2s; }
        .package-card:hover { transform: translateY(-6px); }
    </style>
</head>
<body class="text-gray-800">

<header class="bg-white shadow sticky top-0 z-30 border-b">
    <div class="container mx-auto px-4 md:px-8 py-4 flex justify-between items-center flex-wrap gap-3">
        <div class="flex items-center gap-2 cursor-pointer" onclick="setActiveTab('landing')">
            <i class="fas fa-handshake text-3xl text-red-600"></i>
            <span class="text-2xl font-bold"><span class="text-black">SA</span><span class="text-blue-700">suppliers</span><span class="text-red-600">.</span><span class="text-black">com</span></span>
            <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full hidden sm:inline-block">B2B Marketplace</span>
        </div>
        <!-- Desktop Nav -->
        <div class="hidden md:flex gap-2 flex-wrap">
            <button id="navLandingBtn" class="px-4 py-2 rounded-lg hover:bg-blue-50 transition font-semibold">🏠 Home</button>
            <button id="navMarketplaceBtn" class="px-4 py-2 rounded-lg hover:bg-blue-50 transition">🏪 Marketplace</button>
            <button id="navSuppliersBtn" class="px-4 py-2 rounded-lg hover:bg-blue-50 transition">📦 Suppliers</button>
            <button id="navDashboardBtn" class="px-4 py-2 rounded-lg hover:bg-blue-50 transition hidden supplier-only">⚙️ Supplier Hub</button>
            <button id="navAdminBtn" class="px-4 py-2 rounded-lg bg-gray-900 text-white hover:bg-gray-800 hidden admin-only">👑 Admin Panel</button>
            <div id="authButtons" class="flex gap-2">
                <button id="loginBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white">Login</button>
                <button id="registerBtn" class="px-4 py-2 rounded-lg border border-blue-600 text-blue-600">Register</button>
            </div>
            <div id="userMenu" class="hidden flex items-center gap-3">
                <span id="userNameDisplay" class="text-sm font-medium"></span>
                <button id="profileBtn" class="text-gray-600 hover:text-blue-600"><i class="fas fa-user-circle text-xl"></i></button>
                <button id="logoutBtn" class="text-sm bg-gray-200 px-3 py-1 rounded-lg">Logout</button>
            </div>
        </div>
        <!-- Mobile Menu Button -->
        <div class="md:hidden relative">
            <button id="mobileMenuBtn" class="text-2xl p-2 rounded-lg bg-gray-100"><i class="fas fa-bars"></i></button>
            <div id="mobileDropdown" class="hidden absolute right-0 top-12 bg-white shadow-xl rounded-2xl w-48 z-50 flex flex-col gap-2 p-3 border">
                <button class="mobile-nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50" data-tab="landing">🏠 Home</button>
                <button class="mobile-nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50" data-tab="marketplace">🏪 Marketplace</button>
                <button class="mobile-nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50" data-tab="suppliers">📦 Suppliers</button>
                <button class="mobile-nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-blue-50 supplier-only hidden" data-tab="dashboard">⚙️ Supplier Hub</button>
                <button class="mobile-nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-200 admin-only hidden" data-tab="admin">👑 Admin Panel</button>
                <hr class="my-1">
                <button id="mobileLoginBtn" class="text-left px-3 py-2 rounded-lg bg-blue-600 text-white">Login</button>
                <button id="mobileRegisterBtn" class="text-left px-3 py-2 rounded-lg border border-blue-600 text-blue-600">Register</button>
                <div id="mobileUserMenu" class="hidden flex-col gap-2">
                    <span id="mobileUserName" class="px-3 py-1 font-semibold"></span>
                    <button id="mobileProfileBtn" class="text-left px-3 py-2 rounded-lg hover:bg-gray-100">Profile</button>
                    <button id="mobileLogoutBtn" class="text-left px-3 py-2 rounded-lg bg-gray-200">Logout</button>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 md:px-8 py-8">
    <div id="landingView" class="w-full"></div>
    <div id="marketplaceView" class="hidden w-full"></div>
    <div id="suppliersView" class="hidden w-full"></div>
    <div id="dashboardView" class="hidden w-full"></div>
    <div id="adminView" class="hidden w-full"></div>
</main>

<div id="globalModal" class="fixed inset-0 hidden bg-black/60 modal-backdrop z-50 flex items-center justify-center p-4 transition-all"></div>

<script>
    // ----------------------------- DATA MODEL -----------------------------
    let appData = {
        suppliers: [],
        products: [],
        adminSettings: { autoApproveSuppliers: true, defaultMaxProducts: 25 },
        metrics: { totalVisits: 4321, totalQuotes: 0, totalMessages: 0, growthLog: [] }
    };
    let supplierPermissions = new Map();
    let users = [];
    let currentUser = null;
    let currentTab = 'landing';  // Now landing page is default
    let growthChart = null;

    const marketplaceDiv = document.getElementById('marketplaceView');
    const suppliersDiv = document.getElementById('suppliersView');
    const dashboardDiv = document.getElementById('dashboardView');
    const adminView = document.getElementById('adminView');
    const landingView = document.getElementById('landingView');
    const modalContainer = document.getElementById('globalModal');

    function genId(prefix) { return prefix + Date.now() + '-' + Math.random().toString(36).substring(2, 8); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    function showToast(msg, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `fixed bottom-5 right-5 z-50 ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'} text-white px-5 py-3 rounded-xl shadow-lg toast-notification text-sm md:text-base`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'} mr-2"></i>${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // Seed initial data (original + users)
    function seedFullData() {
        appData.suppliers = [
            { id: "sup1", companyName: "Urban Apparel SA", location: "Johannesburg, Gauteng", isPremium: true, email: "trade@urbanapparel.co.za", phone: "+27 11 222 3344", description: "Leading supplier of bulk textiles & corporate wear.", logo: "https://picsum.photos/id/82/100/100", status: "active" },
            { id: "sup2", companyName: "PackRight Solutions", location: "Cape Town, Western Cape", isPremium: false, email: "hello@packright.co.za", phone: "+27 21 555 6677", description: "Eco-friendly industrial packaging and storage.", logo: "https://picsum.photos/id/12/100/100", status: "active" },
            { id: "sup3", companyName: "Safety First Supplies", location: "Durban, KZN", isPremium: true, email: "orders@safetyfirst.co.za", phone: "+27 31 765 4321", description: "Premium PPE: helmets, vests, gloves.", logo: "https://picsum.photos/id/20/100/100", status: "pending" },
            { id: "sup4", companyName: "Bulk Storage Africa", location: "Pretoria, Gauteng", isPremium: false, email: "info@bulkstorage.co.za", phone: "+27 12 345 6789", description: "Heavy-duty shelving and industrial bins.", logo: "https://picsum.photos/id/42/100/100", status: "pending" },
            { id: "sup5", companyName: "HomeStyle Furniture", location: "Johannesburg, Gauteng", isPremium: true, email: "trade@homestyle.co.za", phone: "+27 10 987 6543", description: "Modern office desks, dining chairs, storage.", logo: "https://picsum.photos/id/55/100/100", status: "active" }
        ];
        appData.products = [
            { id: "prod1", supplierId: "sup1", name: "Premium Cotton T-Shirts (Bulk)", category: "Clothing", description: "100% combed cotton, ideal for branding.", priceRange: "R 45 - R 85", moq: 100, images: ["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"] },
            { id: "prod2", supplierId: "sup1", name: "Custom Printed Workwear", category: "Clothing", description: "Logo printing available, durable fabric.", priceRange: "R 60 - R 120", moq: 50, images: ["https://successprinters.co.za/wp-content/uploads/2021/04/tshirts.jpg"] },
            { id: "prod3", supplierId: "sup3", name: "Industrial Safety Helmets", category: "PPE", description: "Adjustable, shock-resistant, CE certified.", priceRange: "R 70 - R 120", moq: 100, images: ["https://heapro.com/cdn/shop/products/Heapro_LAL8276_1024x1024@2x.jpg"] },
            { id: "prod4", supplierId: "sup2", name: "Heavy-Duty Plastic Crates", category: "Packaging", description: "Stackable, ideal for warehousing.", priceRange: "R 120 - R 250", moq: 50, images: ["https://cdn.shopify.com/s/files/1/0065/0136/7892/files/Pic_3_480x480.png"] }
        ];
        appData.metrics.growthLog = [
            { month: "Jan", count: 2 }, { month: "Feb", count: 2 }, { month: "Mar", count: 3 },
            { month: "Apr", count: 4 }, { month: "May", count: 5 }, { month: "Jun", count: 5 }
        ];
        appData.suppliers.forEach(s => {
            supplierPermissions.set(s.id, { canAddProducts: true, maxProducts: 25, approved: s.status === 'active', canEditProfile: true });
        });
        appData.metrics.totalQuotes = 124;
        appData.metrics.totalMessages = 57;

        users = [
            { id: "user_admin", email: "admin@sasuppliers.com", password: "admin123", role: "admin", name: "System Admin", company: "" },
            { id: "user_sup1", email: "supplier@urbanapparel.co.za", password: "supplier123", role: "supplier", supplierId: "sup1", name: "Urban Manager", company: "Urban Apparel SA" },
            { id: "user_buyer1", email: "buyer@example.com", password: "buyer123", role: "buyer", name: "John Buyer", company: "Retail Holdings" }
        ];
        saveToLocal();
    }

    function ensureDataIntegrity() {
        appData.products.forEach(p => { if(!p.images || !p.images.length) p.images = ['https://picsum.photos/id/48/400/300']; if(!p.category) p.category = "General"; if(!p.moq) p.moq = 50; if(!p.priceRange) p.priceRange = "R 0 - R 0"; });
        appData.suppliers.forEach(s => { if(!s.logo) s.logo = 'https://picsum.photos/id/20/100/100'; if(!s.status) s.status = 'active'; if(!s.phone) s.phone = "+27 11 555 6789"; if(!s.email) s.email = `${s.companyName.toLowerCase().replace(/\s/g,'')}@b2b.co.za`; if(!s.description) s.description = "Trusted B2B supplier."; if(s.isPremium === undefined) s.isPremium = false; });
        if(!appData.metrics.growthLog.length) generateGrowthLog();
    }

    function generateGrowthLog() {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug"];
        const base = Math.max(3, appData.suppliers.length);
        appData.metrics.growthLog = months.map((m, i) => ({ month: m, count: Math.floor(base * (0.4 + i * 0.1)) }));
        const current = appData.suppliers.filter(s => s.status === 'active').length;
        if(appData.metrics.growthLog[appData.metrics.growthLog.length-1].count !== current)
            appData.metrics.growthLog.push({ month: "Sep", count: current });
    }

    function saveToLocal() {
        const toStore = { appData, permissions: Object.fromEntries(supplierPermissions), users };
        localStorage.setItem("sasuppliers_auth_v1", JSON.stringify(toStore));
    }

    function loadData() {
        const stored = localStorage.getItem("sasuppliers_auth_v1");
        if(stored) {
            try {
                const parsed = JSON.parse(stored);
                appData = parsed.appData || appData;
                supplierPermissions = new Map(Object.entries(parsed.permissions || {}));
                users = parsed.users || [];
                if(!users.length) seedFullData();
            } catch(e) { seedFullData(); }
        } else { seedFullData(); }
        ensureDataIntegrity();
        const savedSession = localStorage.getItem("sasuppliers_session");
        if(savedSession) {
            try {
                const sessionUser = JSON.parse(savedSession);
                const found = users.find(u => u.id === sessionUser.id && u.role === sessionUser.role);
                if(found) currentUser = { ...found, password: undefined };
            } catch(e) {}
        }
        updateUIBasedOnAuth();
        saveToLocal();
    }

    // ----------------------------- AUTHENTICATION -----------------------------
    function login(email, password) {
        const user = users.find(u => u.email === email && u.password === password);
        if(!user) { showToast("Invalid email or password", "error"); return false; }
        currentUser = { ...user, password: undefined };
        localStorage.setItem("sasuppliers_session", JSON.stringify({ id: user.id, email: user.email, role: user.role }));
        showToast(`Welcome ${user.name || user.email}`);
        updateUIBasedOnAuth();
        closeModal();
        if(currentUser.role === 'admin') setActiveTab('admin');
        else if(currentUser.role === 'supplier') setActiveTab('dashboard');
        else setActiveTab('marketplace');
        return true;
    }

    function register(userData) {
        if(users.find(u => u.email === userData.email)) { showToast("Email already registered", "error"); return false; }
        const newUser = {
            id: genId("user"),
            email: userData.email,
            password: userData.password,
            role: userData.role,
            name: userData.name,
            company: userData.company || "",
            supplierId: null
        };
        if(userData.role === 'supplier') {
            const newSupplier = {
                id: genId("sup"),
                companyName: userData.company,
                location: userData.location || "Johannesburg",
                isPremium: false,
                email: userData.email,
                phone: userData.phone || "+27 00 000 0000",
                description: userData.description || "New supplier onboarded",
                logo: "https://picsum.photos/id/1/100/100",
                status: appData.adminSettings.autoApproveSuppliers ? 'active' : 'pending'
            };
            appData.suppliers.push(newSupplier);
            supplierPermissions.set(newSupplier.id, { canAddProducts: true, maxProducts: 25, approved: newSupplier.status === 'active', canEditProfile: true });
            newUser.supplierId = newSupplier.id;
            showToast("Supplier registration submitted. Awaiting approval.", "success");
        } else {
            showToast("Buyer account created. You can now login.", "success");
        }
        users.push(newUser);
        saveToLocal();
        return login(userData.email, userData.password);
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem("sasuppliers_session");
        updateUIBasedOnAuth();
        setActiveTab('landing');
        showToast("Logged out successfully");
    }

    function updateUIBasedOnAuth() {
        const isLoggedIn = !!currentUser;
        const isAdmin = currentUser?.role === 'admin';
        const isSupplier = currentUser?.role === 'supplier';
        document.querySelectorAll('.supplier-only').forEach(el => el.classList.toggle('hidden', !isSupplier && !isAdmin));
        document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
        const authDiv = document.getElementById('authButtons');
        const userMenuDiv = document.getElementById('userMenu');
        if(isLoggedIn) {
            authDiv.classList.add('hidden');
            userMenuDiv.classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.name || currentUser.email.split('@')[0];
        } else {
            authDiv.classList.remove('hidden');
            userMenuDiv.classList.add('hidden');
        }
        const mobileUserMenu = document.getElementById('mobileUserMenu');
        const mobileAuthParent = document.getElementById('mobileLoginBtn')?.parentNode;
        if(isLoggedIn) {
            if(mobileAuthParent) mobileAuthParent.classList.add('hidden');
            mobileUserMenu.classList.remove('hidden');
            document.getElementById('mobileUserName').innerText = currentUser.name || currentUser.email.split('@')[0];
        } else {
            if(mobileAuthParent) mobileAuthParent.classList.remove('hidden');
            mobileUserMenu.classList.add('hidden');
        }
        refreshAllViews();
    }

    function showProfileModal() {
        if(!currentUser) { showToast("Please login first", "error"); return; }
        let html = `<div class="bg-white rounded-2xl max-w-md w-full p-6"><h3 class="text-xl font-bold mb-4"><i class="fas fa-user-circle"></i> My Profile</h3><form id="profileForm">`;
        if(currentUser.role === 'supplier') {
            const supplier = appData.suppliers.find(s => s.id === currentUser.supplierId);
            html += `<input id="profileName" placeholder="Contact Name" value="${escapeHtml(currentUser.name || '')}" class="border p-2 w-full mb-3 rounded"><input id="profileCompany" placeholder="Company Name" value="${escapeHtml(supplier?.companyName || '')}" class="border p-2 w-full mb-3 rounded"><input id="profileEmail" type="email" placeholder="Email" value="${escapeHtml(currentUser.email)}" class="border p-2 w-full mb-3 rounded"><input id="profilePhone" placeholder="Phone" value="${escapeHtml(supplier?.phone || '')}" class="border p-2 w-full mb-3 rounded"><textarea id="profileDesc" rows="2" placeholder="Company Description" class="border p-2 w-full mb-3 rounded">${escapeHtml(supplier?.description || '')}</textarea><input id="profileLocation" placeholder="Location" value="${escapeHtml(supplier?.location || '')}" class="border p-2 w-full mb-3 rounded">`;
        } else {
            html += `<input id="profileName" placeholder="Full Name" value="${escapeHtml(currentUser.name || '')}" class="border p-2 w-full mb-3 rounded"><input id="profileCompany" placeholder="Company (optional)" value="${escapeHtml(currentUser.company || '')}" class="border p-2 w-full mb-3 rounded"><input id="profileEmail" type="email" placeholder="Email" value="${escapeHtml(currentUser.email)}" class="border p-2 w-full mb-3 rounded" disabled>`;
        }
        html += `<div class="flex gap-3 mt-2"><button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded-xl">Save Changes</button><button type="button" id="closeProfileBtn" class="bg-gray-300 px-4 py-2 rounded-xl">Cancel</button></div></form></div>`;
        modalContainer.innerHTML = html;
        modalContainer.classList.remove('hidden');
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newName = document.getElementById('profileName')?.value;
            if(newName) currentUser.name = newName;
            if(currentUser.role === 'supplier') {
                const supplier = appData.suppliers.find(s => s.id === currentUser.supplierId);
                if(supplier) {
                    supplier.companyName = document.getElementById('profileCompany')?.value || supplier.companyName;
                    supplier.phone = document.getElementById('profilePhone')?.value || supplier.phone;
                    supplier.description = document.getElementById('profileDesc')?.value || supplier.description;
                    supplier.location = document.getElementById('profileLocation')?.value || supplier.location;
                    const newEmail = document.getElementById('profileEmail')?.value;
                    if(newEmail && newEmail !== currentUser.email) {
                        supplier.email = newEmail;
                        currentUser.email = newEmail;
                        const userRecord = users.find(u => u.id === currentUser.id);
                        if(userRecord) userRecord.email = newEmail;
                    }
                }
            } else if(currentUser.role === 'buyer') {
                currentUser.company = document.getElementById('profileCompany')?.value || '';
                const userRecord = users.find(u => u.id === currentUser.id);
                if(userRecord) userRecord.company = currentUser.company;
            }
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if(userIndex !== -1) users[userIndex] = { ...users[userIndex], name: currentUser.name, email: currentUser.email, company: currentUser.company };
            saveToLocal();
            updateUIBasedOnAuth();
            closeModal();
            showToast("Profile updated");
            refreshAllViews();
        });
        document.getElementById('closeProfileBtn').onclick = closeModal;
    }

    function showLoginModal() {
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md w-full p-6"><h3 class="text-2xl font-bold mb-4">Login</h3><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" class="border p-2 w-full mb-3 rounded" required><input id="loginPassword" type="password" placeholder="Password" class="border p-2 w-full mb-3 rounded" required><button type="submit" class="bg-blue-700 text-white w-full py-2 rounded-xl font-semibold">Sign In</button><p class="text-center text-sm mt-3">Demo: admin@sasuppliers.com / admin123<br>supplier@urbanapparel.co.za / supplier123<br>buyer@example.com / buyer123</p></form><button id="closeLoginBtn" class="absolute top-2 right-2 text-gray-500"><i class="fas fa-times"></i></button></div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        });
        document.getElementById('closeLoginBtn').onclick = closeModal;
    }

    function showRegisterModal() {
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md w-full p-6"><h3 class="text-2xl font-bold mb-4">Register</h3><form id="registerForm"><select id="regRole" class="border p-2 w-full mb-3 rounded"><option value="buyer">Buyer</option><option value="supplier">Supplier</option></select><input id="regName" placeholder="Full Name" class="border p-2 w-full mb-3 rounded" required><input id="regEmail" type="email" placeholder="Email" class="border p-2 w-full mb-3 rounded" required><input id="regPassword" type="password" placeholder="Password (min 4 chars)" class="border p-2 w-full mb-3 rounded" required><div id="supplierFields" class="hidden"><input id="regCompany" placeholder="Company Name" class="border p-2 w-full mb-3 rounded"><input id="regLocation" placeholder="Location (City, Province)" class="border p-2 w-full mb-3 rounded"><input id="regPhone" placeholder="Phone Number" class="border p-2 w-full mb-3 rounded"><textarea id="regDesc" rows="2" placeholder="Company Description" class="border p-2 w-full mb-3 rounded"></textarea></div><button type="submit" class="bg-green-700 text-white w-full py-2 rounded-xl font-semibold">Create Account</button></form><button id="closeRegBtn" class="absolute top-2 right-2 text-gray-500"><i class="fas fa-times"></i></button></div>`;
        modalContainer.classList.remove('hidden');
        const roleSelect = document.getElementById('regRole');
        const supplierDiv = document.getElementById('supplierFields');
        roleSelect.addEventListener('change', () => supplierDiv.classList.toggle('hidden', roleSelect.value !== 'supplier'));
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = roleSelect.value;
            const userData = {
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                name: document.getElementById('regName').value,
                role: role,
                company: role === 'supplier' ? document.getElementById('regCompany').value : document.getElementById('regCompany')?.value || '',
                location: role === 'supplier' ? document.getElementById('regLocation').value : '',
                phone: role === 'supplier' ? document.getElementById('regPhone').value : '',
                description: role === 'supplier' ? document.getElementById('regDesc').value : ''
            };
            if(!userData.email || !userData.password || !userData.name) { showToast("Please fill all required fields", "error"); return; }
            if(userData.role === 'supplier' && !userData.company) { showToast("Company name required for supplier", "error"); return; }
            register(userData);
        });
        document.getElementById('closeRegBtn').onclick = closeModal;
    }

    // ----------------------------- LANDING PAGE (Marketing & Subscriptions) -----------------------------
    function renderLanding() {
        const heroHtml = `
        <div class="landing-hero rounded-3xl text-white p-8 md:p-12 mb-12">
            <div class="max-w-3xl">
                <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Source locally. Grow faster.</h1>

    let filters = { search: '' };

        let filtered = appData.products.filter(p => getSupplier(p.supplierId)?.status === 'active');

            refreshAllViews();
            closeModal();
            showToast("Product updated");
        });
        document.getElementById('closeModalForm').onclick = closeModal;
    }

    function deleteProduct(productId) {
        if(currentUser?.role !== 'supplier') return;
        const p = appData.products.find(p => p.id === productId);
        if(p.supplierId !== currentUser.supplierId && currentUser.role !== 'admin') { showToast("Unauthorized","error"); return; }
        if(confirm("Delete this product permanently?")) {
            appData.products = appData.products.filter(p => p.id !== productId);
            saveToLocal();
            refreshAllViews();
            showToast("Product deleted", "error");
        }
    }

    function showProductDetail(productId) {
        const p = appData.products.find(x => x.id === productId);
        const s = getSupplier(p.supplierId);
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-2xl w-full p-6"><h2 class="text-2xl font-bold">${escapeHtml(p.name)}</h2><img src="${p.images[0]}" class="w-full rounded-xl my-4 max-h-72 object-cover"><p>${escapeHtml(p.description)}</p><p class="mt-3 font-semibold text-blue-700">${p.priceRange} | MOQ ${p.moq}</p><p class="mt-2 text-sm">Supplier: ${s.companyName} • ${s.phone}</p><div class="mt-5 flex gap-3"><button onclick="closeModal(); showQuoteModal('${p.id}')" class="bg-emerald-600 text-white px-5 py-2 rounded-xl">Request Quote</button><button onclick="closeModal()" class="bg-gray-300 px-5 py-2 rounded-xl">Close</button></div></div>`;
        modalContainer.classList.remove('hidden');
    }

    function showQuoteModal(productId) {
        const p = appData.products.find(x => x.id === productId);
        const s = getSupplier(p.supplierId);
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md w-full p-6"><h3 class="text-xl font-bold">Quote Request: ${escapeHtml(p.name)}</h3><textarea id="quoteMsg" class="border w-full p-2 rounded my-3" rows="3" placeholder="Enter quantity/specifications"></textarea><div class="flex gap-3"><button id="sendQuoteBtn" class="bg-blue-700 text-white px-4 py-2 rounded-xl">Send</button><button onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded-xl">Cancel</button></div></div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('sendQuoteBtn').onclick = () => {
            appData.metrics.totalQuotes++;
            saveToLocal();
            showToast('Quote request sent to ' + s.email);
            closeModal();
            refreshAllViews();
        };
    }

    function contactSupplierModal(supplierId) {
        const s = getSupplier(supplierId);
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md w-full p-6"><h3 class="text-xl font-bold">Contact ${escapeHtml(s.companyName)}</h3><textarea id="msg" rows="3" class="border w-full p-2 rounded my-3" placeholder="Your message..."></textarea><div class="flex gap-3"><button id="sendMsgBtn" class="bg-indigo-700 text-white px-4 py-2 rounded-xl">Send Message</button><button onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded-xl">Close</button></div></div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('sendMsgBtn').onclick = () => {
            appData.metrics.totalMessages++;
            saveToLocal();
            showToast('Message sent to ' + s.email);
            closeModal();
            refreshAllViews();
        };
    }

    function supplierProductsModal(supplierId) {
        const s = getSupplier(supplierId);
        const prods = appData.products.filter(p => p.supplierId === supplierId);
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-lg w-full p-5"><h3 class="font-bold text-xl mb-3">${escapeHtml(s.companyName)} Products</h3>${prods.map(p => `<div class='border-b py-2'><b>${escapeHtml(p.name)}</b> - ${p.priceRange}<br><span class='text-sm text-gray-500'>MOQ ${p.moq}</span></div>`).join('') || '<p>No products listed</p>'}<button onclick="closeModal()" class="mt-4 bg-gray-400 text-white px-4 py-2 rounded">Close</button></div>`;
        modalContainer.classList.remove('hidden');
    }

    function editSupplierAdmin(supp) {
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md p-6"><h3>Edit Supplier</h3><form id="adminEditSupForm"><input id="editName" value="${escapeHtml(supp.companyName)}" class="border p-2 w-full my-2"><input id="editEmail" value="${supp.email}" class="border p-2 w-full"><textarea id="editDesc" rows="2" class="border p-2 w-full my-2">${escapeHtml(supp.description)}</textarea><button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded-xl">Save</button><button type="button" id="closeEditAdmin" class="ml-2 bg-gray-300 px-4 py-2 rounded-xl">Cancel</button></form></div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('adminEditSupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            supp.companyName = document.getElementById('editName').value;
            supp.email = document.getElementById('editEmail').value;
            supp.description = document.getElementById('editDesc').value;
            saveToLocal();
            refreshAllViews();
            closeModal();
            showToast("Supplier updated");
        });
        document.getElementById('closeEditAdmin').onclick = closeModal;
    }

    function showAdminAddSupplier() {
        modalContainer.innerHTML = `<div class="bg-white rounded-2xl max-w-md p-6"><h3>➕ Onboard New Supplier</h3><form id="adminAddSupForm"><input id="compName" placeholder="Company Name" class="border p-2 w-full my-2"><input id="compEmail" placeholder="Email" class="border p-2 w-full"><input id="compLoc" placeholder="Location" class="border p-2 w-full my-2"><textarea id="compDesc" rows="2" placeholder="Description" class="border p-2 w-full"></textarea><button type="submit" class="bg-green-700 text-white px-4 py-2 rounded-xl">Create</button><button type="button" id="closeAddSup" class="ml-2 bg-gray-300 px-4 py-2 rounded-xl">Cancel</button></form></div>`;
        modalContainer.classList.remove('hidden');
        document.getElementById('adminAddSupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newSup = { id: genId('sup'), companyName: document.getElementById('compName').value, email: document.getElementById('compEmail').value, location: document.getElementById('compLoc').value, description: document.getElementById('compDesc').value, logo: 'https://picsum.photos/id/1/100/100', isPremium: false, status: appData.adminSettings.autoApproveSuppliers ? 'active' : 'pending', phone: "+27 00 000 0000" };
            if(!newSup.companyName) { showToast("Company name required", "error"); return; }
            appData.suppliers.push(newSup);
            supplierPermissions.set(newSup.id, { canAddProducts: true, maxProducts: 25, approved: newSup.status === 'active' });
            saveToLocal();
            refreshAllViews();
            closeModal();
            showToast("Supplier onboarded", "success");
        });
        document.getElementById('closeAddSup').onclick = closeModal;
    }

    function getSupplier(id) { return appData.suppliers.find(s => s.id === id); }
    function closeModal() { modalContainer.classList.add('hidden'); }

    // Navigation
    function setActiveTab(tab) {
        currentTab = tab;
        document.querySelectorAll('#landingView, #marketplaceView, #suppliersView, #dashboardView, #adminView').forEach(v => v.classList.add('hidden'));
        if(tab === 'landing') landingView.classList.remove('hidden');
        else if(tab === 'marketplace') marketplaceDiv.classList.remove('hidden');
        else if(tab === 'suppliers') suppliersDiv.classList.remove('hidden');
        else if(tab === 'dashboard') dashboardDiv.classList.remove('hidden');
        else if(tab === 'admin') adminView.classList.remove('hidden');
        refreshAllViews();
    }

    // Event bindings
    document.getElementById('navLandingBtn').onclick = () => setActiveTab('landing');
    document.getElementById('navMarketplaceBtn').onclick = () => setActiveTab('marketplace');
    document.getElementById('navSuppliersBtn').onclick = () => setActiveTab('suppliers');
    document.getElementById('navDashboardBtn').onclick = () => { if(currentUser?.role==='supplier') setActiveTab('dashboard'); else showToast("Supplier login required","error"); };
    document.getElementById('navAdminBtn').onclick = () => { if(currentUser?.role==='admin') setActiveTab('admin'); else showToast("Admin access only","error"); };
    document.getElementById('loginBtn').onclick = showLoginModal;
    document.getElementById('registerBtn').onclick = showRegisterModal;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('profileBtn').onclick = showProfileModal;
    document.getElementById('mobileLoginBtn').onclick = showLoginModal;
    document.getElementById('mobileRegisterBtn').onclick = showRegisterModal;
    document.getElementById('mobileProfileBtn').onclick = showProfileModal;
    document.getElementById('mobileLogoutBtn').onclick = logout;
    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => document.getElementById('mobileDropdown').classList.toggle('hidden'));
    document.querySelectorAll('.mobile-nav-btn').forEach(btn => btn.addEventListener('click', (e) => { setActiveTab(btn.dataset.tab); document.getElementById('mobileDropdown').classList.add('hidden'); }));

    // Initialize
    loadData();
    setActiveTab('landing');
</script>
</body>
</html>
